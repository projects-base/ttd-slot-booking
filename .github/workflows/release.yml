name: Release

# Builds the extension zip and uploads it to the Chrome Web Store as a DRAFT.
# Publishing (which submits to Google's review queue) stays manual — you review
# the draft in the developer dashboard and click Publish there.
#
# Triggered by pushing a version tag that matches manifest.json, e.g.
#   git tag v5.4 && git push origin v5.4
# or from the Actions tab via "Run workflow".
#
# Required repository secrets:
#   FIREBASE_CONFIG_JS      full contents of firebase-config.js (it is gitignored)
#   CHROME_EXTENSION_ID     the item id from the Web Store dashboard URL
#   CHROME_CLIENT_ID        OAuth client id  (Google Cloud console)
#   CHROME_CLIENT_SECRET    OAuth client secret
#   CHROME_REFRESH_TOKEN    OAuth refresh token for the Web Store API

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the bundle to the Chrome Web Store as a draft'
        type: boolean
        default: false

permissions:
  contents: write # to attach the zip to a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$tag' but manifest.json says '$manifest'. Bump the manifest or retag."
            exit 1
          fi
          echo "Releasing version $manifest"

      - name: Restore firebase-config.js
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JS" ]; then
            echo "::error::Secret FIREBASE_CONFIG_JS is not set. The bundle would ship without Firebase config and the side panel would stall behind the login overlay."
            exit 1
          fi
          printf '%s\n' "$FIREBASE_CONFIG_JS" > firebase-config.js
          # Fail fast on a malformed secret rather than shipping a broken zip.
          node --check firebase-config.js
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('firebase-config.js', 'utf8');
            for (const key of ['apiKey', 'authDomain', 'projectId', 'appId']) {
              if (!src.includes(key)) {
                console.error('::error::firebase-config.js is missing ' + key);
                process.exit(1);
              }
            }
          "

      - name: Sanity-check the sources parse
        run: |
          node --check content.js
          node --check sidepanel.js
          node --check background.js
          node --check data.js

      - name: Bundle
        id: bundle
        run: |
          chmod +x scripts/bundle.sh
          ./scripts/bundle.sh

      - name: Upload bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttd-seva-bot-${{ steps.bundle.outputs.version }}
          path: ${{ steps.bundle.outputs.zip }}
          retention-days: 30

      - name: Upload draft to the Chrome Web Store
        # Tag pushes always upload; manual runs only when the box is ticked.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload
        env:
          ZIP: ${{ steps.bundle.outputs.zip }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for var in EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret CHROME_$var is not set."
              exit 1
            fi
          done

          # Reads a field out of a response that may not be JSON at all —
          # Google returns HTML or an empty body for some errors, and letting jq
          # choke on that would mask the real failure.
          field() { printf '%s' "$2" | jq -re "$1" 2>/dev/null || true; }

          # curl must not abort the step on an HTTP error: the response body is
          # where Google explains what went wrong, so capture status and body and
          # decide for ourselves. -w writes the status on its own trailing line.
          echo "Exchanging refresh token for an access token..."
          token_raw=$(curl -sS -w $'\n%{http_code}' -X POST \
            https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token) || true
          token_code=$(printf '%s' "$token_raw" | tail -n1)
          token_body=$(printf '%s' "$token_raw" | sed '$d')

          access_token=$(field '.access_token' "$token_body")
          if [ -z "$access_token" ]; then
            err=$(field '.error' "$token_body")
            desc=$(field '.error_description' "$token_body")
            echo "::error::Token exchange failed (HTTP $token_code): ${err:-unknown} ${desc:+- $desc}"
            case "$err" in
              invalid_grant)
                echo "::error::invalid_grant usually means the refresh token was revoked or expired. Google expires refresh tokens after 7 days while the OAuth consent screen is still in Testing — set it to In production and mint a new token." ;;
              invalid_client)
                echo "::error::invalid_client means CHROME_CLIENT_ID / CHROME_CLIENT_SECRET do not match the OAuth client the token was issued for." ;;
            esac
            exit 1
          fi

          echo "Uploading $ZIP to item $EXTENSION_ID..."
          up_raw=$(curl -sS -w $'\n%{http_code}' -X PUT \
            -H "Authorization: Bearer $access_token" \
            -H "x-goog-api-version: 2" \
            -T "$ZIP" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID") || true
          up_code=$(printf '%s' "$up_raw" | tail -n1)
          up_body=$(printf '%s' "$up_raw" | sed '$d')

          echo "HTTP $up_code"
          printf '%s\n' "$up_body" | jq . 2>/dev/null || printf '%s\n' "$up_body"

          case "$up_code" in
            404)
              echo "::error::HTTP 404 for item $EXTENSION_ID. The API can only update an extension that already exists in the store — the first version has to be uploaded by hand in the dashboard. Also check CHROME_EXTENSION_ID, and that the authorised Google account can publish this item."
              exit 1 ;;
            401|403)
              echo "::error::HTTP $up_code. The token is valid but not accepted for this item: confirm the Chrome Web Store API is enabled on the Google Cloud project, and that the account you authorised has publish rights to $EXTENSION_ID."
              exit 1 ;;
          esac

          state=$(field '.uploadState' "$up_body")
          case "$state" in
            SUCCESS)
              echo "::notice::Draft uploaded. Review it in the Chrome Web Store dashboard and click Publish when ready." ;;
            IN_PROGRESS)
              # Large packages finish asynchronously; not a failure.
              echo "::notice::Upload accepted and still processing. Check the dashboard shortly." ;;
            *)
              detail=$(field '[.itemError[]?.error_detail] | join("; ")' "$up_body")
              echo "::error::Upload finished with state '${state:-unknown}' (HTTP $up_code). ${detail:-No further detail returned.}"
              exit 1 ;;
          esac

      - name: Attach the zip to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.zip }}
          generate_release_notes: true
